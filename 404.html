<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Crimson+Pro:wght@600&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #0d5d7f;
    --accent: #00a896;
    --white: #ffffff;
    --font-sans: 'IBM Plex Sans', sans-serif;
    --font-serif: 'Crimson Pro', serif;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: var(--font-sans);
    background: linear-gradient(135deg, var(--primary), #084561);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    text-align: center;
    padding: 2rem;
}

.container {
    max-width: 600px;
}

.error-code {
    font-family: var(--font-serif);
    font-size: 8rem;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 1rem;
    text-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

h1 {
    font-family: var(--font-serif);
    font-size: 2.5rem;
    margin-bottom: 1rem;
}

p {
    font-size: 1.125rem;
    opacity: 0.9;
    margin-bottom: 2rem;
    line-height: 1.6;
}

.btn {
    display: inline-block;
    padding: 1rem 2.5rem;
    background: var(--accent);
    color: var(--white);
    text-decoration: none;
    border-radius: 50px;
    font-weight: 600;
    font-size: 1.0625rem;
    transition: all 0.3s ease;
    box-shadow: 0 10px 30px rgba(0,168,150,0.3);
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(0,168,150,0.4);
}

.links {
    margin-top: 3rem;
    display: flex;
    gap: 2rem;
    justify-content: center;
    flex-wrap: wrap;
}

.links a {
    color: var(--white);
    text-decoration: none;
    opacity: 0.8;
    transition: opacity 0.3s;
}

.links a:hover {
    opacity: 1;
}

@media (max-width: 768px) {
    .error-code {
        font-size: 5rem;
    }
    
    h1 {
        font-size: 2rem;
    }
    
    p {
        font-size: 1rem;
    }
}
</style>

</head>

<body>
<div class="container">
    <div class="error-code">404</div>
    <h1>Page non trouvée</h1>
    <p>Désolé, la page que vous recherchez n'existe pas ou a été déplacée. Retournez à l'accueil pour accéder à nos services de soins infirmiers à Limoges.</p>

```
<a href="/index.html" class="btn">Retour à l'accueil</a>

<div class="links">
    <a href="/index.html#services">Nos services</a>
    <a href="/index.html#contact">Nous contacter</a>
    <a href="/blog/actualites.html">Blog</a>
    <a href="tel:+33682410661">📞 06.82.41.06.61</a>
</div>
```

</div>
</body>
</html>
